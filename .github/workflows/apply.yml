name: Terraform Apply (2 Stages)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY to confirm deployment"
        required: true

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Confirm execution
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "APPLY" ]; then
            echo "Confirmation failed. Type APPLY to confirm."
            exit 1
          fi

      # Stage 1: Base Infra + EKS (no K8s add-ons)
      - name: Apply Base Infra (enable_k8s=false)
        env:
          TF_VAR_jenkins_user_public_key: ${{ secrets.JENKINS_USER_PUBLIC_KEY }}
          TF_VAR_jenkins_nodes_public_key: ${{ secrets.JENKINS_NODES_PUBLIC_KEY }}
          TF_VAR_jenkins_nodes_private_key: ${{ secrets.JENKINS_NODES_PRIVATE_KEY }}
        run: terraform apply -auto-approve -var="enable_k8s=false"

      # (اختياري) تحديث kubeconfig لو محتاجه للـ providers اللي بتكلم الكلاستر
      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name netflix-eks-cluster

      # Stage 2: K8s Add-ons
      - name: Apply K8s Add-ons (enable_k8s=true)
        env:
          TF_VAR_jenkins_user_public_key: ${{ secrets.JENKINS_USER_PUBLIC_KEY }}
          TF_VAR_jenkins_nodes_public_key: ${{ secrets.JENKINS_NODES_PUBLIC_KEY }}
          TF_VAR_jenkins_nodes_private_key: ${{ secrets.JENKINS_NODES_PRIVATE_KEY }}
        run: terraform apply -auto-approve

      - name: Show Terraform Outputs
        run: terraform output
