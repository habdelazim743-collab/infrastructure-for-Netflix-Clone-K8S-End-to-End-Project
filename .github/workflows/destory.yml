name: Terraform Destroy (2 Stages)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DESTROY to confirm destruction"
        required: true

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - run: terraform init -input=false

      - name: Confirm execution
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DESTROY" ]; then
            echo "Confirmation failed. Type DESTROY to confirm."
            exit 1
          fi

      # Stage 1: Remove K8s Add-ons first
      - name: Remove K8s Add-ons (enable_k8s=false)
        env:
          TF_VAR_jenkins_user_public_key: ${{ secrets.JENKINS_USER_PUBLIC_KEY }}
          TF_VAR_jenkins_nodes_public_key: ${{ secrets.JENKINS_NODES_PUBLIC_KEY }}
          TF_VAR_jenkins_nodes_private_key: ${{ secrets.JENKINS_NODES_PRIVATE_KEY }}
        run: terraform apply -auto-approve -var="enable_k8s=false"

      # Stage 2: Destroy remaining infra
      - name: Destroy Infra
        env:
          TF_VAR_jenkins_user_public_key: ${{ secrets.JENKINS_USER_PUBLIC_KEY }}
          TF_VAR_jenkins_nodes_public_key: ${{ secrets.JENKINS_NODES_PUBLIC_KEY }}
          TF_VAR_jenkins_nodes_private_key: ${{ secrets.JENKINS_NODES_PRIVATE_KEY }}
        run: terraform destroy -auto-approve
